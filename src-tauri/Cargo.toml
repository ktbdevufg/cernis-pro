[package]
name    = "cernis-pro"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "cernis-pro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq  = { version = "2.9", default-features = false, features = ["native-tls"] }
dirs  = "5.0"
libc  = "0.2"

[features]
default         = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic         = "abort"
codegen-units = 8
lto           = false
opt-level     = "s"
strip         = true
