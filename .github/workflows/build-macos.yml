name: Build macOS

# Baut das verteilbare macOS-Paket (.dmg) nativ auf macos-latest (Apple Silicon /
# aarch64) und fuehrt dazu den unveraenderten build.sh aus.
#
# ENTSCHEIDENDER UNTERSCHIED ZUM LINUX-WORKFLOW (wie schon bei Windows): Auf macOS
# gibt es KEINEN Container. Der Linux-Job baut sein Debian-13-Image aus einem
# Dockerfile und fuehrt den Build DARIN aus -- das geht auf macOS-Runnern nicht
# (Docker ist dort nicht verfuegbar). Statt eines Images kommt die Toolchain hier
# ueber Setup-Actions: Node 20 (setup-node), uv (setup-uv), Rust stable
# (rust-toolchain). Es gibt daher keinen "Image bauen"-Schritt und kein chown/
# Besitzrechte-Zuruecksetzen (kein root im Container, der Runner-User besitzt die
# Dateien ohnehin).
#
# WARUM KEIN actions/setup-python: Das Projekt laesst uv den Interpreter verwalten.
# Das Linux-Dockerfile haelt fest, dass PyInstaller mit Python 3.13 inkompatibel
# ist, und ruft darum 'uv python install 3.12'. Wir machen es genauso -- ein
# eigener Schritt 'uv python install 3.12' vor 'uv sync'. Mit setup-python koennte
# der Runner 3.13 ziehen und PyInstaller scheitert.
#
# SIGNING: JEDER Lauf baut echt signiert (Developer ID) -- auch Dispatch-Laeufe.
# Das ist keine Vorliebe, sondern eine Konsequenz aus build.sh: seit der Haertung
# (Commit 2e9f596) bricht build.sh in Schritt 0 mit exit 1 ab, wenn
# APPLE_SIGNING_IDENTITY leer ist, und prueft am Ende zusaetzlich, dass die .app
# NICHT ad-hoc signiert ist (Signature=adhoc / fehlender TeamIdentifier -> Fehler).
# Ein unsignierter Pfad ist damit nicht mehr aufrufbar; der frueher hier stehende
# Kommentar ("baut unsigniert, Tauri signiert ad-hoc") stammt aus der Zeit VOR
# dieser Haertung und war veraltet. Darum: Zertifikat-Import in eine temporaere
# Keychain laeuft IMMER, nicht nur an v-Tags.
#
# NOTARISIERUNG dagegen strikt NUR an v-Tags: sie ist langsam (Apple-Roundtrip)
# und ausschliesslich fuer das echte Release-Asset noetig. Dispatch-Laeufe sind
# Smoke-Tests des Bauvorgangs -- die brauchen kein Apple-Ticket.
# Versions-Suffix arm64.

on:
  # Manueller Knopf (Actions-Tab) ...
  workflow_dispatch:
  push:
    # ... und automatisch bei Release-Tags v*.
    tags:
      - "v*"

jobs:
  build-macos:
    # macos-latest zeigt aktuell auf Apple Silicon (arm64) -- nativer aarch64-Build,
    # kein Cross-Compile noetig.
    runs-on: macos-latest
    # Schreibrecht auf contents ist noetig, damit der Workflow bei v-Tags ein
    # GitHub-Release anlegen und Assets hochladen darf. Bewusst auf Job-Ebene
    # (nicht Workflow-Ebene) und nur dieses eine Recht -- minimale Rechte: die
    # Dispatch-Builds brauchen es nicht, schaden aber nicht.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Toolchain via Setup-Actions statt via Container-Image. Versionen exakt
      # wie in ci.yml und im Linux-Dockerfile (Node 20, uv, Rust stable),
      # damit kein Drift zwischen den Werkbaenken entsteht.
      - name: Node einrichten (LTS 20)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: uv installieren
        uses: astral-sh/setup-uv@v8.1.0

      - name: Rust-Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      # Wie im Linux-Dockerfile: PyInstaller ist mit Python 3.13 inkompatibel,
      # darum uv explizit auf 3.12 festnageln, BEVOR 'uv sync' laeuft. Bewusst
      # KEIN setup-python -- der wuerde evtl. 3.13 bringen.
      - name: Python 3.12 via uv installieren (PyInstaller-kompatibel)
        run: uv python install 3.12

      # Build-Version zur BUILD-ZEIT als Python-Datei erzeugen. config.py liest
      # os.environ NICHT -- es importiert diese Datei. PyInstaller friert sie
      # mit ein, damit die installierte App die volle Version kennt (kein
      # Laufzeit-Env noetig). Der Suffix nennt nur die Architektur (arm64), NICHT
      # das Paketformat -- gleiche Begruendung wie im Linux-Workflow. Format wie
      # dort: 2.0.0+arm64.<7-stelliger-sha>, SHA via 'git rev-parse --short=7'.
      # macos-latest laeuft mit bash, darum dieselbe heredoc-Variante wie im
      # Linux-Workflow (kein BOM-Problem wie bei PowerShell/Windows).
      - name: Build-Version erzeugen (_build_version.py)
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          # Produktversion aus pyproject.toml ableiten (Quelle der Wahrheit).
          PRODUCT_VERSION=$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')
          [ -n "$PRODUCT_VERSION" ] || { echo "FEHLER: Produktversion aus pyproject.toml nicht lesbar"; exit 1; }
          BUILD_VERSION="${PRODUCT_VERSION}+arm64.${SHORT_SHA}"
          echo "Build-Version: ${BUILD_VERSION}"
          cat > backend/infrastructure/_build_version.py <<EOF
          """Im CI erzeugte Build-Version. Nicht committet (siehe .gitignore)."""

          BUILD_VERSION = "${BUILD_VERSION}"
          EOF

      # build.sh setzt eine vorhandene .venv voraus (Schritt 0 bricht sonst mit
      # exit 1 ab). Der Linux-Container macht 'uv sync' auch separat VOR
      # build-linux.sh -- hier genauso: Deps + .venv (inkl. Dev-Gruppe fuer
      # PyInstaller) vor dem Build synchronisieren.
      - name: Python-Deps (uv sync)
        run: uv sync --locked --group dev

      # build.sh Schritt 0 prueft 'nmap' und bricht sonst mit exit 1 ab.
      # macos-latest-Runner haben nmap NICHT vorinstalliert -- daher hier VOR dem
      # Build per Homebrew nachinstallieren.
      - name: nmap installieren (build.sh Schritt 0 erwartet es)
        run: brew install nmap

      # Das Developer-ID-Zertifikat in eine EIGENE, temporaere Keychain importieren --
      # nie in die login.keychain des Runners. Der Runner ist ephemer, aber eine
      # dedizierte Keychain haelt den privaten Schluessel auf diesen Job begrenzt und
      # macht das Aufraeumen trivial (die VM wird verworfen). Das Keychain-Passwort ist
      # zufaellig und bleibt prozesslokal -- es wird nie ausgegeben.
      # Laeuft IMMER (nicht nur an v-Tags), weil build.sh die Signatur erzwingt
      # (siehe Kopfkommentar); ohne diesen Schritt braeche jeder Lauf in Schritt 0 ab.
      - name: Signing-Zertifikat in temporaere Keychain importieren
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PWD=$(openssl rand -base64 24)
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          CERT="$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          # Auto-Lock-Timeout 6 h: die Keychain darf waehrend des gesamten Builds
          # nicht zuschnappen, sonst scheitert codesign mittendrin.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"

          # Die neue Keychain VORNE in die Suchliste, die bestehenden aber behalten
          # (sonst findet 'security find-identity' -- und damit build.sh -- nichts,
          # bzw. es gehen die System-Zertifikate der login.keychain verloren).
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          # Ohne Partition-List fragt macOS beim Signieren interaktiv nach dem
          # Passwort -- im CI gibt es niemanden, der antwortet: der Build haengt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null

          # Kontrollausgabe: zeigt die Developer-ID (kein Geheimnis) im Log.
          security find-identity -v -p codesigning "$KEYCHAIN"

      # BEFUND, DER DIESEN SCHRITT NOETIG MACHT: Das ausgelieferte dmg trug
      # bisher ein Ticket, die .app DARIN nicht. Auf einer Maschine ohne Netz
      # verweigert macOS deshalb den Start der INSTALLIERTEN Anwendung -- das
      # dmg-Ticket nuetzt nach dem Kopieren nichts mehr.
      # Gemessen im tauri-bundler 2.8.1: sind APPLE_API_KEY, APPLE_API_ISSUER
      # und APPLE_API_KEY_PATH gesetzt, verpackt der Bundler die .app selbst mit
      # ditto, reicht sie mit 'notarytool submit --wait' ein und fuehrt 'xcrun
      # stapler staple' darauf aus -- alles VOR dem dmg-Bau. Der Bundler
      # erwartet den Schluessel als DATEI; darum muss sie existieren, BEVOR
      # build.sh laeuft.
      # Dekodierung (base64 --decode) und Ablage im RUNNER_TEMP wortgleich aus
      # dem bestehenden Notarisierungsschritt uebernommen, plus chmod 600. Der
      # Schluessel wird nie ausgegeben: 'echo "$MACOS_API_KEY"' schreibt direkt
      # in die Datei, ins Protokoll gelangt nur der PFAD.
      # Bedingung identisch zum bestehenden Notarisierungsschritt -- nur v-Tags.
      - name: Notarisierungs-Schluessel als Datei bereitstellen (nur v-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MACOS_API_KEY: ${{ secrets.MACOS_API_KEY }}
        run: |
          set -euo pipefail
          NOTARY_DIR="$RUNNER_TEMP/notary"
          KEY="$NOTARY_DIR/AuthKey.p8"
          mkdir -p "$NOTARY_DIR"
          echo "$MACOS_API_KEY" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          # Pfad (kein Geheimnis) an die folgenden Schritte durchreichen.
          echo "NOTARY_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          echo "Schluesseldatei bereitgestellt: $KEY"

      # Den unveraenderten build.sh ausfuehren. Er erledigt selbst: nmap-Check,
      # venv-Aktivierung, Frontend-Build, beide PyInstaller-Binaries, Binaries
      # fuer Tauri bereitstellen, Tauri-Build (.dmg) und das Einsammeln.
      # APPLE_SIGNING_IDENTITY ist gesetzt -> echte Developer-ID-Signatur fuer
      # .app UND .dmg; build.sh verifiziert das am Ende selbst (kein adhoc,
      # TeamIdentifier vorhanden). Der Wert muss exakt der Identitaet aus der
      # oben importierten Keychain entsprechen, sonst bricht build.sh ab.
      #
      # DIE DREI NOTARISIERUNGSVARIABLEN steuern den Bundler (siehe Schritt
      # darueber). Bedeutung streng auseinanderhalten:
      #   APPLE_API_KEY      = die Key-ID (z.B. 'ABCD123456'), NICHT der Inhalt
      #                        -> Secret MACOS_API_KEY_ID
      #   APPLE_API_ISSUER   = die Issuer-UUID -> Secret MACOS_API_ISSUER_ID
      #   APPLE_API_KEY_PATH = Dateipfad zur .p8 aus dem Schritt darueber
      # Das Secret MACOS_API_KEY (der base64-kodierte Schluesselinhalt) gehoert
      # hier bewusst NICHT hin -- es geht ausschliesslich in die Datei.
      # Im Nicht-Tag-Lauf liefert derselbe Bedingungsausdruck wie oben den
      # leeren String; der Bundler ueberspringt die Notarisierung dann still,
      # und Dispatch-Laeufe loesen keinen Apple-Roundtrip aus.
      - name: macOS-Build (build.sh -- Frontend + Binaries + Tauri/dmg, signiert)
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_API_ISSUER_ID || '' }}
          APPLE_API_KEY_PATH: ${{ startsWith(github.ref, 'refs/tags/v') && env.NOTARY_KEY_PATH || '' }}
        run: bash build.sh

      # Notarisierung -- NUR an v-Tags (siehe Kopfkommentar: langsamer Apple-
      # Roundtrip, nur fuers echte Release-Asset noetig). Reihenfolge zwingend:
      # build.sh signiert .app UND .dmg -> notarytool prueft das eingereichte .dmg
      # -> stapler heftet das Ticket ans .dmg. Genotarisiert wird das dmg als
      # Container; die .app darin ist bereits Developer-ID-signiert und wird von
      # Apple mitgeprueft -- fuer die dmg-Verteilung ist das der uebliche Weg.
      # Muss VOR dem Release-Asset-Schritt liegen, damit das hochgeladene dmg das
      # angeheftete Ticket bereits traegt (Gatekeeper offline-tauglich).
      - name: dmg notarisieren und stapeln (nur v-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MACOS_API_KEY: ${{ secrets.MACOS_API_KEY }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          NOTARY_DIR="$RUNNER_TEMP/notary"
          KEY="$NOTARY_DIR/AuthKey.p8"
          mkdir -p "$NOTARY_DIR"
          echo "$MACOS_API_KEY" | base64 --decode > "$KEY"
          # Der Key liegt im RUNNER_TEMP; unabhaengig vom Ausgang wieder loeschen.
          trap 'rm -f "$KEY"' EXIT

          DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "FEHLER: kein .dmg unter src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/ gefunden."
            echo "Ohne Paket gibt es nichts zu notarisieren -- der Build davor kann nicht erfolgreich gewesen sein."
            exit 1
          fi
          echo "Notarisiere: $DMG"

          # --wait blockiert bis zum Apple-Ergebnis; ein abgelehnter Submit liefert
          # einen Exit-Code != 0 und bricht den Schritt ab (kein stiller Durchlauf).
          xcrun notarytool submit "$DMG" \
            --key "$KEY" \
            --key-id "$MACOS_API_KEY_ID" \
            --issuer "$MACOS_API_ISSUER_ID" \
            --wait --timeout 30m

          # Ticket anheften, damit Gatekeeper das dmg auch OHNE Netz akzeptiert.
          xcrun stapler staple "$DMG"
          # Harte Gegenprobe: muss erfolgreich sein, sonst ist der Schritt rot.
          xcrun stapler validate "$DMG"
          # Zusaetzliche Sichtprueferei fuers Log -- spctl bewertet dmg-Container
          # nicht immer eindeutig, darum bewusst NICHT abbruchrelevant.
          spctl -a -vvv -t install "$DMG" 2>&1 || true

          # GEGENPROBE -- der eigentliche Wert dieses Schnitts: 'stapler
          # validate' auf das dmg oben sagt NUR, dass der CONTAINER ein Ticket
          # traegt. Genau das war der Trugschluss, der den Befund verdeckt hat:
          # die .app IM dmg kann trotzdem ungestapelt sein, und nur sie
          # ueberlebt das Kopieren nach /Applications. Ohne diese Pruefung
          # waere derselbe Fehler beim naechsten Mal wieder unsichtbar.
          # Dazu das dmg READ-ONLY einhaengen (-readonly, -nobrowse: kein
          # Finder-Fenster im CI), stapler validate auf die .app darin, wieder
          # aushaengen. Der trap haengt auch im Fehlerfall wieder aus -- sonst
          # bliebe die Image-Anbindung haengen.
          MOUNT_DIR="$RUNNER_TEMP/dmg-gegenprobe"
          mkdir -p "$MOUNT_DIR"
          trap 'rm -f "$KEY"; hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -readonly -nobrowse -noverify -mountpoint "$MOUNT_DIR"

          APP=$(find "$MOUNT_DIR" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "FEHLER: keine .app im gemounteten dmg gefunden -- die Gegenprobe kann nicht greifen."
            exit 1
          fi
          echo "Gegenprobe auf: $APP"

          if ! xcrun stapler validate "$APP"; then
            echo "FEHLER: die .app IM dmg traegt KEIN Notarisierungsticket."
            echo "Das dmg allein reicht nicht: nach dem Kopieren nach /Applications"
            echo "startet die Anwendung auf einer Maschine ohne Netz nicht."
            echo "Ursache pruefen: APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH"
            echo "muessen im env-Block des build.sh-Schritts gesetzt sein."
            exit 1
          fi
          echo "Gegenprobe bestanden: .app im dmg traegt ein Ticket."

          hdiutil detach "$MOUNT_DIR"
          # trap wieder auf das blosse Loeschen des Schluessels zuruecknehmen --
          # das Image ist ausgehaengt, ein zweites detach waere sinnlos.
          trap 'rm -f "$KEY"' EXIT

      # Aufraeumen des Schluessels aus dem Bereitstellungsschritt. BEWUSST ein
      # eigener Schritt mit if always() statt der trap-Technik des
      # Notarisierungsschritts darueber: dort entsteht der Schluessel INNERHALB
      # desselben run-Blocks, der ihn nutzt -- ein EXIT-trap deckt seine ganze
      # Lebensdauer ab. Der Schluessel aus 3.1 dagegen ueberspannt MEHRERE
      # Schritte (Bereitstellen -> build.sh); ein trap im Bereitstellungsschritt
      # loeschte ihn sofort beim Ende jenes Schritts, und der Bundler faende ihn
      # nicht mehr. if always() sorgt dafuer, dass er auch nach einem
      # gescheiterten Build oder einer gescheiterten Notarisierung verschwindet.
      - name: Notarisierungs-Schluessel entfernen
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/notary/AuthKey.p8"
          echo "Schluesseldatei entfernt (sofern vorhanden)."

      # Pruefsummen der Pakete. Platzierung zwingend NACH dem Notarisierungs-
      # Schritt darueber -- das ist hier der entscheidende Punkt: 'xcrun stapler
      # staple' HEFTET das Apple-Ticket AN die dmg-Datei (stapler(1): "attaches
      # tickets ... to app bundles, disk images, and packages"). Der Dateiinhalt
      # aendert sich dadurch. Eine vor der Notarisierung gebildete Pruefsumme
      # beschriebe also eine Datei, die so NICHT ausgeliefert wird -- genau im
      # Tag-Lauf, dem einzigen, der Assets veroeffentlicht. Darum danach.
      #
      # KEINE if-Bedingung, obwohl der Notarisierungs-Schritt darueber eine hat:
      # die Pruefsummen entstehen bei jedem Trigger, damit ein Dispatch-Lauf den
      # Schritt mitprueft und nicht erst der Tag-Lauf. Beide Faelle stimmen:
      # im Dispatch-Lauf entfaellt die Notarisierung, die Pruefsumme beschreibt
      # die ungestapelte dmg; im Tag-Lauf lief sie vorher, die Pruefsumme
      # beschreibt die gestapelte dmg -- also jeweils die reale Datei.
      #
      # Werkzeugwahl shasum statt sha256sum: shasum liegt als /usr/bin/shasum in
      # jeder macOS-Fassung, sha256sum erst seit macOS 26. macos-latest zeigt
      # nicht zwingend auf macOS 26 -- shasum ist die belastbare Wahl. Das
      # Ausgabeformat ist byteweise identisch (gemessen): Pruefsumme, zwei
      # Leerzeichen, Dateiname, LF. Durch den Wechsel ins Verzeichnis der Datei
      # steht dort der blosse Dateiname ohne Pfad -- so traegt 'sha256sum -c
      # datei.sha256' (bzw. 'shasum -a 256 -c') im Zielverzeichnis.
      - name: Pruefsummen der Pakete erzeugen
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"

          ANZAHL=0
          while IFS= read -r PAKET; do
            ( cd "$(dirname "$PAKET")" && shasum -a 256 "$(basename "$PAKET")" > "$(basename "$PAKET").sha256" )
            echo "$(cat "${PAKET}.sha256")"
            ANZAHL=$((ANZAHL + 1))
          done < <(find "$BUNDLE" -type f -name '*.dmg' | sort)

          # Abbruch mit benannter Meldung, wenn keine einzige Paketdatei gefunden
          # wurde. Kein stiller Durchlauf, kein Rueckfall auf eine schwaechere
          # Pruefung -- ein leerer Fund ist ein Fehler, kein Normalfall.
          [ "$ANZAHL" -gt 0 ] || { echo "FEHLER: keine dmg-Datei unter ${BUNDLE} gefunden"; exit 1; }
          echo "Pruefsummen erzeugt: ${ANZAHL}"

      # Ab hier Fallunterscheidung nach Trigger -- identische Logik wie im
      # Windows-/Linux-Workflow, nur mit dem macOS-Bundle-Pfad (dmg). Das Triple
      # ist der build.sh-Default aarch64-apple-darwin.
      #
      # Fall a) v-Tag: als GitHub-Release-Asset veroeffentlichen (zaehlt nicht
      # gegen das 500-MB-Artefaktlimit und verfaellt nicht). softprops/action-
      # gh-release legt ein fehlendes Release idempotent an und bietet mit
      # fail_on_unmatched_files die geforderte Abbruch-bei-leerem-Glob-Semantik.
      # Die .dmg ist der von build.sh garantierte Output.
      - name: Release erstellen und dmg als Asset anhaengen (nur v-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: CERNIS PRO ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }} -- Release-Notes werden separat gepflegt."
          draft: false
          # Gemeinsame Festlegung ALLER Build-Workflows: prerelease true, weil ein
          # Tag-Build noch keinen Plattform-Test belegt -- die Freigabe erfolgt von
          # Hand (z.B. nach Gatekeeper-Pruefung des dmg auf einem zweiten Mac).
          prerelease: true
          fail_on_unmatched_files: true
          # Jedes Muster MUSS im Tag-Lauf treffen, sonst faellt das Release
          # (fail_on_unmatched_files oben). Das .sha256-Muster trifft, weil der
          # Schritt "Pruefsummen der Pakete erzeugen" ohne if-Bedingung neben
          # JEDER dmg eine gleichnamige .sha256 anlegt und sonst selbst abbricht
          # -- gibt es eine dmg, gibt es auch ihre Pruefsumme.
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sha256

      # Fall b) kein v-Tag (workflow_dispatch / temporaerer rewrite/v2-Push):
      # BEWUSST KEIN Artefakt-Upload. Ein grosses dmg je Push fuellte das
      # 2-GB-Gratis-Storage-Kontingent auf. Bei Push-Laeufen ist der erfolgreiche
      # Durchlauf des Builds selbst der Beweis -- die fertige .dmg wird nicht
      # gebraucht. Verteilbare Pakete entstehen ausschliesslich an v-Tags und
      # werden dort (Fall a oben) als GitHub-Release-Asset veroeffentlicht.
