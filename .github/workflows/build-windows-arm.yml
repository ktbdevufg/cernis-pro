name: Build Windows ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-arm:
    runs-on: windows-11-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten (LTS 20)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: uv installieren
        uses: astral-sh/setup-uv@v8.1.0

      - name: Rust-Toolchain (stable) + ARM64-Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Python 3.12 via uv installieren (PyInstaller-kompatibel)
        run: uv python install 3.12

      - name: Build-Version erzeugen (_build_version.py)
        shell: pwsh
        run: |
          $shortSha = (git rev-parse --short=7 HEAD).Trim()
          # Produktversion aus pyproject.toml ableiten (Quelle der Wahrheit).
          $productVersion = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $productVersion) { Write-Error "Produktversion aus pyproject.toml nicht lesbar"; exit 1 }
          $buildVersion = "$productVersion+winarm64.$shortSha"
          Write-Host "Build-Version: $buildVersion"
          $content = @"
          """Im CI erzeugte Build-Version. Nicht committet (siehe .gitignore)."""

          BUILD_VERSION = "$buildVersion"
          "@
          $target = Join-Path $PWD "backend\infrastructure\_build_version.py"
          [System.IO.File]::WriteAllText($target, $content, (New-Object System.Text.UTF8Encoding($false)))

      - name: MSVC-Umgebung einrichten (msvc-dev-cmd, arm64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Windows-ARM64-Build (build.ps1)
        shell: pwsh
        env:
          CERNIS_BUILD_TRIPLE: aarch64-pc-windows-msvc
        run: .\build.ps1

      # Pruefsummen der Pakete. Wie im x64-Workflow: NACH dem Bau-Schritt und VOR
      # dem Release-Schritt, ohne if-Bedingung, damit auch ein Dispatch-Lauf den
      # Schritt mitprueft. Einziger Unterschied ist das Triple
      # (aarch64-pc-windows-msvc). Nach build.ps1 veraendert kein Schritt die exe
      # mehr, die Pruefsumme beschreibt also genau die ausgelieferte Datei.
      #
      # Format: Get-FileHash liefert GROSSbuchstaben, sha256sum schreibt klein --
      # darum .ToLower(), dann zwei Leerzeichen und der blosse Dateiname.
      #
      # BOM und Zeilenende: [System.IO.File]::WriteAllText mit UTF8Encoding($false)
      # unterdrueckt die BOM, das Zeilenende steht als explizites "`n" (LF) im
      # String und wird unveraendert geschrieben. Out-File/Set-Content schieden
      # aus: CRLF, unter Windows PowerShell zusaetzlich BOM -- damit scheiterte
      # 'sha256sum -c' auf Linux/macOS.
      - name: Pruefsummen der Pakete erzeugen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "src-tauri\target\aarch64-pc-windows-msvc\release\bundle\nsis"

          $pakete = @(Get-ChildItem -Path $bundle -Filter *.exe -File -ErrorAction SilentlyContinue | Sort-Object Name)

          foreach ($paket in $pakete) {
            $hash = (Get-FileHash -Path $paket.FullName -Algorithm SHA256).Hash.ToLower()
            $zeile = "$hash  $($paket.Name)`n"
            $ziel = "$($paket.FullName).sha256"
            [System.IO.File]::WriteAllText($ziel, $zeile, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host $zeile.TrimEnd("`n")
          }

          # Abbruch mit benannter Meldung, wenn keine einzige Paketdatei gefunden
          # wurde. Kein stiller Durchlauf, kein Rueckfall auf eine schwaechere
          # Pruefung -- ein leerer Fund ist ein Fehler, kein Normalfall.
          if ($pakete.Count -eq 0) {
            Write-Error "FEHLER: keine exe-Datei unter $bundle gefunden"
            exit 1
          }
          Write-Host "Pruefsummen erzeugt: $($pakete.Count)"

      # Die Lizenzaufstellung als EIGENSTAENDIGE Beigabe bereitstellen. Sie
      # entsteht im Bau unter src-tauri/lizenzaufstellung.json und geht ueber
      # bundle.resources in den NSIS-Installer -- also nur INNERHALB des Pakets.
      # Das Website-Projekt erzeugt daraus die oeffentliche Lizenzseite und kann
      # keine exe auspacken; darum hier eine benannte Kopie neben dem Installer.
      #
      # NAMENSSCHEMA <paketdateiname>.lizenzaufstellung.json: die Beigabe traegt
      # den Namen des Installers, neben dem sie liegt -- dieselbe Konvention wie
      # bei der .sha256-Datei des Schritts darueber.
      #
      # EINDEUTIGKEIT IM RELEASE folgt damit aus dem Paketnamen: der traegt
      # Fassung und Architektur bereits und unterscheidet sich vom x64-Installer
      # -- ein gleichnamiges zweites Asset kann im selben Release nicht
      # entstehen.
      #
      # Die Pakete werden auf DEMSELBEN Weg ermittelt wie im unmittelbar davor
      # stehenden Pruefsummen-Schritt (gleiches Get-ChildItem-Filtermuster,
      # gleiche Sortierung) -- kein zweites, eigenes Suchmuster.
      #
      # GEGENPROBE PRODUKTVERSION: der Name stammt jetzt vom PAKET, nicht mehr
      # aus der Datei. Damit Inhalt und Name nicht auseinanderlaufen koennen,
      # wird die produktversion aus der Aufstellung gelesen und geprueft, dass
      # diese Zeichenfolge im Paketdateinamen vorkommt. Trifft sie nicht zu,
      # gehoeren Aufstellung und Paket zu verschiedenen Fassungen -- Abbruch mit
      # benannter Meldung, die BEIDE Werte nennt. Die plattform wird weiterhin
      # gelesen und ausgegeben, damit im Bauprotokoll sichtbar bleibt, welche
      # Aufstellung entstand.
      #
      # Kein stiller Ausfall: $ErrorActionPreference = "Stop" plus die
      # ausdruecklichen Pruefungen -- fehlt die Datei, ist sie leer, kein
      # gueltiges JSON, fehlt eines der beiden Felder oder findet sich kein
      # Paket, bricht der Schritt mit benannter Meldung ab. Gleiche Bauart wie im
      # x64-Workflow.
      - name: Lizenzaufstellung als benannte Kopie bereitstellen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $quelle = "src-tauri\lizenzaufstellung.json"
          $bundle = "src-tauri\target\aarch64-pc-windows-msvc\release\bundle\nsis"

          if (-not (Test-Path -Path $quelle -PathType Leaf)) {
            Write-Error "FEHLER: $quelle wurde nicht erzeugt"; exit 1
          }
          if ((Get-Item $quelle).Length -eq 0) {
            Write-Error "FEHLER: $quelle ist leer"; exit 1
          }

          $aufstellung = Get-Content -Path $quelle -Raw -Encoding UTF8 | ConvertFrom-Json
          $produktversion = $aufstellung.produktversion
          $plattform = $aufstellung.plattform
          if ([string]::IsNullOrWhiteSpace($produktversion)) {
            Write-Error "FEHLER: Feld 'produktversion' fehlt oder ist leer in $quelle"; exit 1
          }
          if ([string]::IsNullOrWhiteSpace($plattform)) {
            Write-Error "FEHLER: Feld 'plattform' fehlt oder ist leer in $quelle"; exit 1
          }

          Write-Host "--- Lizenzaufstellung ---"
          Write-Host "Produktversion: $produktversion"
          Write-Host "Plattform:      $plattform"

          $pakete = @(Get-ChildItem -Path $bundle -Filter *.exe -File -ErrorAction SilentlyContinue | Sort-Object Name)

          foreach ($paket in $pakete) {
            if (-not $paket.Name.Contains($produktversion)) {
              Write-Error "FEHLER: Produktversion '$produktversion' aus $quelle kommt im Paketdateinamen '$($paket.Name)' nicht vor -- Aufstellung und Paket gehoeren zu verschiedenen Fassungen"
              exit 1
            }
            $ziel = "$($paket.FullName).lizenzaufstellung.json"
            Copy-Item -Path $quelle -Destination $ziel -Force
            if ((Get-Item $ziel).Length -eq 0) {
              Write-Error "FEHLER: Kopie $ziel ist leer"; exit 1
            }
            Write-Host "Beigabe: $(Split-Path -Leaf $ziel)"
          }

          # Abbruch mit benannter Meldung, wenn keine einzige Paketdatei gefunden
          # wurde -- ohne Paket gibt es keinen Namen fuer die Beigabe.
          if ($pakete.Count -eq 0) {
            Write-Error "FEHLER: keine exe-Datei unter $bundle gefunden"
            exit 1
          }
          Write-Host "Lizenzaufstellungen abgelegt: $($pakete.Count)"

      # NUR die Lizenzaufstellung als Actions-Artefakt -- ausdruecklich NICHT der
      # Installer. Dieser Workflow legt sonst bewusst kein Artefakt ab: ein
      # ~850-MB-Bundle je Lauf fuellte das 2-GB-Gratis-Storage-Kontingent auf
      # (Begruendung wie im x64-Windows- und im macOS-Workflow). Die Aufstellung
      # ist rund ein Megabyte; auf sie trifft diese Begruendung nicht zu. Sie
      # wird gerade dann gebraucht, wenn KEIN Tag gesetzt ist: das
      # Website-Projekt soll die Lizenzseite auch aus einem Dispatch-Lauf ziehen
      # koennen.
      #
      # Optionen bewusst identisch zur Linux-Seite (if-no-files-found: error,
      # retention-days: 14, actions/upload-artifact@v7) -- kein Sonderweg und
      # keine neue Action-Fassung. Der Artefaktname traegt windows-arm64, damit
      # er nicht mit dem des x64-Windows-Workflows kollidiert.
      #
      # Das Muster nennt das nsis-Bundle-Verzeichnis, weil die Beigabe jetzt
      # NEBEN dem Installer liegt. Es endet auf .lizenzaufstellung.json und
      # greift damit ausschliesslich die Aufstellung -- der Installer selbst
      # bleibt trotz gleichen Verzeichnisses aussen vor, die Groessen-Begruendung
      # oben bleibt gewahrt.
      - name: Lizenzaufstellung als Artefakt ablegen (jeder Lauf)
        uses: actions/upload-artifact@v7
        with:
          name: cernis-pro-lizenzaufstellung-windows-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.lizenzaufstellung.json

      - name: Release erstellen und Installer als Asset anhaengen (nur v-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: CERNIS PRO
          body: Release -- Release-Notes werden separat gepflegt.
          draft: false
          # Gemeinsame Festlegung ALLER Build-Workflows: prerelease true, Freigabe von Hand.
          prerelease: true
          fail_on_unmatched_files: true
          # Jedes Muster MUSS im Tag-Lauf treffen, sonst faellt das Release
          # (fail_on_unmatched_files oben). Das .sha256-Muster trifft, weil der
          # Schritt "Pruefsummen der Pakete erzeugen" ohne if-Bedingung neben
          # JEDER NSIS-exe eine gleichnamige .sha256 anlegt und sonst selbst
          # abbricht -- gibt es einen Installer, gibt es auch seine Pruefsumme.
          # Das Lizenz-Muster trifft aus demselben Grund: der Schritt
          # "Lizenzaufstellung als benannte Kopie bereitstellen" legt ohne
          # if-Bedingung neben JEDER NSIS-exe eine gleichnamige
          # .lizenzaufstellung.json an und bricht sonst selbst ab. Der Name
          # stammt vom Paket; weil der ARM64-Installer anders heisst als der
          # x64-Installer, kollidiert die Beigabe im selben Release nicht mit der
          # x64-Beigabe.
          files: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.sha256
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.lizenzaufstellung.json
