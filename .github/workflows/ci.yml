name: CI

# Quality-Gate fuer den Backend-Rewrite (v2). Bewusst auf frischem Checkout:
# `uv sync --locked` schlaegt fehl, sobald uv.lock und pyproject.toml
# auseinanderlaufen -- so faellt Lock-/Config-Drift auf, statt unbemerkt zu
# bleiben. Der uv-Cache ist reine Download-Beschleunigung (auf uv.lock gekeyt)
# und beruehrt diesen Frische-Test nicht: das venv wird pro Lauf neu gebaut.

on:
  push:
    branches: [main, dev, "rewrite/v2"]
  pull_request:
    branches: [main, dev]

# Laufende Laeufe pro Branch abbrechen, wenn neue Commits kommen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: uv installieren (+ Download-Cache, gekeyt auf uv.lock)
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Frische-Test + Install (Lock muss zu pyproject passen)
        run: uv sync --locked

      - name: Ruff (Lint)
        run: uv run ruff check backend

      - name: Ruff (Format-Check)
        run: uv run ruff format --check backend

      - name: mypy (strict)
        run: uv run mypy

      # ZWEITE PRUEFRICHTUNG -- kein versehentlicher Doppelaufruf:
      # mypy wertet `sys.platform` STATISCH aus. Der Runner hier ist Linux, also
      # gilt jeder `if sys.platform == "win32":`-Block als unerreichbar und wird
      # nie geprueft -- Fehler in den Windows-Zweigen faenden wir erst auf einer
      # Windows-Maschine. Der zweite Lauf prueft darum ausdruecklich gegen win32.
      # Eigener Cache-Ordner: ein Plattformwechsel entwertet den Zwischenspeicher,
      # beide Laeufe wuerden sich sonst gegenseitig die Ergebnisse verwerfen.
      # `always()`: laeuft auch nach rotem erstem Schritt, damit ein Durchlauf
      # BEIDE Richtungen zeigt. Ein rotes Ergebnis laesst den Job weiterhin
      # scheitern -- die Bedingung schluckt den Ausgang nicht.
      - name: mypy (strict, Zielplattform Windows/win32)
        if: always()
        run: uv run mypy --platform win32 --cache-dir "${{ runner.temp }}/mypy_cache_win32"

      - name: import-linter (Architektur-Regeln)
        run: PYTHONPATH=backend uv run lint-imports

      # NODE IM QUALITY-JOB -- kein Versehen und keine Frontend-Arbeit hier:
      # Die Naht-Tests rufen die ECHTEN Frontend-Quellen ueber `node` auf, statt
      # sie in Python nachzubauen (etwa `frontend/src/api/traffic.js`). Ohne node
      # auf dem Runner griffe ihr Riegel -- die Tests uebersprangen sich hier
      # still und die gepruefte Naht war in der CI ungedeckt. Gleiche Action und
      # gleiche Fassung wie im frontend-Job, damit beide Jobs nicht
      # auseinanderlaufen.
      - name: Node einrichten (LTS 20, fuer die node-gestuetzten Naht-Tests)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # WARUM HIER DOCH INSTALLIERT WIRD: ein Teil der Naht-Tests buendelt echte
      # Frontend-Dateien mit `esbuild` (und rendert mit `react-dom`), zieht die
      # Pakete also aus `frontend/node_modules`. Der blosse Interpreter reicht
      # dafuer NICHT -- ohne diesen Schritt fiel etwa
      # `backend/tests/test_sni_status_autorefresh_naht.py` mit
      # ERR_MODULE_NOT_FOUND (Lauf 31816836761). Seit S89-A1 ueberspringt sich in
      # der CI ausserdem keiner dieser Tests mehr: fehlt hier etwas, faellt es
      # benannt auf, statt still durchzugehen (`backend/tests/naht_frontend.py`).
      # Gleiche Schreibweise wie im frontend-Job.
      - name: Frontend-Abhaengigkeiten installieren (fuer die node-gestuetzten Naht-Tests)
        working-directory: frontend
        run: npm ci

      - name: pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten (LTS 20, npm-Cache)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencies installieren (aus Lockfile)
        working-directory: frontend
        run: npm ci

      - name: Vite-Build
        working-directory: frontend
        run: npm run build
