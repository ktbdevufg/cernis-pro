name: Build Linux

# Baut das verteilbare Linux-Paket (deb + AppImage) BEWUSST auf gesunder
# GitHub-Hardware. Grund: die lokale VM produziert nicht-deterministische
# PyInstaller-Crashes; auf ubuntu-latest laeuft die bestehende CI gruen.
# Das Ergebnis (Bundle-Ordner) wird als herunterladbares Artefakt abgelegt.
# build-linux.sh selbst bleibt unveraendert -- dieser Workflow ruft es nur auf.

on:
  # Manueller Knopf (Actions-Tab) ...
  workflow_dispatch:
  push:
    # ... push auf den Entwicklungs-Branch loest den Build waehrend der
    # Entwicklung direkt aus (workflow_dispatch greift nur auf main) ...
    branches:
      - "rewrite/v2"
    # ... und automatisch bei Release-Tags v*.
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # System-Deps fuer build-linux.sh + Tauri. Auf dem GitHub-Runner mit sudo
      # (anders als lokal, wo die Deps bereits installiert sind) -- hier korrekt.
      # libpython3.12 liefert die Shared Library, die PyInstaller zum Bundeln braucht.
      - name: System-Abhaengigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nmap \
            libcap2-bin \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libpython3.12

      - name: Node einrichten (LTS 20, npm-Cache)
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: uv installieren (+ Download-Cache, gekeyt auf uv.lock)
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Rust-Toolchain (fuer Tauri, stable)
        uses: dtolnay/rust-toolchain@stable

      # Dev-Gruppe zieht PyInstaller; --locked erzwingt, dass uv.lock zu
      # pyproject passt (analog CI-Frische-Test).
      - name: Python-Abhaengigkeiten installieren (inkl. Dev-Gruppe)
        run: uv sync --locked --group dev

      - name: Linux-Build (Frontend + Binaries + Tauri-Bundle)
        run: bash build-linux.sh

      - name: Bundle als Artefakt hochladen (deb + AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: cernis-pro-linux-deb
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/
          if-no-files-found: error
