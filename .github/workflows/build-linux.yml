name: Build Linux

# Baut das verteilbare Linux-Paket (deb + rpm) auf der Debian-13-
# Werkbank. Grund: Ubuntus libpcap.so.0.8 ist gegen libibverbs.so.1 (RDMA)
# gelinkt; Debian-Ziele haben libibverbs nicht. cernis-sniffd traegt cap_net_raw
# via setcap und laeuft als AT_SECURE-Prozess -- glibc ignoriert dann
# LD_LIBRARY_PATH, die mitgebundelte libibverbs ist unerreichbar, dlopen(libpcap)
# scheitert ("libpcap is not available"). Ein Debian-13-Build bundelt eine
# libpcap OHNE libibverbs-NEEDED und loest den SNI-Blocker.
#
# Container-Strategie: Das Image wird im Workflow aus der im Repo liegenden
# Dockerfile.build.debian13 gebaut (docker build) und die Build-Schritte laufen
# DARIN. Bewusst NICHT das container:-Feld von Actions mit einer im YAML
# wiederholten Paketliste: das Dockerfile bleibt so die EINZIGE Quelle der
# Wahrheit fuer Toolchain und System-Pakete (Node/Rust/uv/Python 3.12, libpcap,
# file, desktop-file-utils). Kein Drift zwischen Dockerfile und Workflow.
# build-linux.sh selbst bleibt unveraendert -- der Container ruft es nur auf.

on:
  # Manueller Knopf (Actions-Tab) ...
  workflow_dispatch:
  push:
    # ... und automatisch bei Release-Tags v*.
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Schreibrecht auf contents ist noetig, damit der Workflow bei v-Tags ein
    # GitHub-Release anlegen und Assets hochladen darf. Bewusst auf Job-Ebene
    # (nicht Workflow-Ebene) und nur dieses eine Recht -- minimale Rechte: die
    # Dispatch-Builds brauchen es nicht, schaden aber nicht.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Das Build-Image aus der repo-eigenen Dockerfile.build.debian13 bauen.
      # Alle Toolchains (Node 20, Rust stable, uv, Python 3.12) und System-Deps
      # (libpcap0.8-dev, file, desktop-file-utils, Tauri-GTK-Deps) sind
      # bereits im Image -- deshalb entfallen setup-node / rust-toolchain /
      # setup-uv und der separate System-Abhaengigkeiten-apt-Schritt.
      - name: Build-Image bauen (Debian 13, Quelle der Wahrheit)
        run: docker build -f Dockerfile.build.debian13 -t cernis-build:debian13 .

      # Build-Version zur BUILD-ZEIT als Python-Datei erzeugen. config.py liest
      # os.environ NICHT -- es importiert diese Datei. PyInstaller friert sie
      # mit ein, damit die installierte App die volle Version kennt (kein
      # Laufzeit-Env noetig). Der Suffix nennt nur die Architektur (x64), NICHT
      # das Paketformat: ein Build erzeugt aus denselben Binaries deb und
      # rpm -- ein Format-Suffix waere bei einem von zwei Bundles falsch. Das
      # Format sieht der Nutzer an der Dateiendung. Die Architektur bleibt drin,
      # weil spaeter ARM-Builds dazukommen.
      # git laeuft auf dem Host (Runner), die Datei landet im ausgecheckten Repo
      # und ist beim spaeteren Bind-Mount im Container sichtbar.
      - name: Build-Version erzeugen (_build_version.py)
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          # Produktversion aus pyproject.toml ableiten (Quelle der Wahrheit) --
          # nicht fest eintippen, damit der naechste Bump automatisch ankommt.
          PRODUCT_VERSION=$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')
          [ -n "$PRODUCT_VERSION" ] || { echo "FEHLER: Produktversion aus pyproject.toml nicht lesbar"; exit 1; }
          BUILD_VERSION="${PRODUCT_VERSION}+linuxx64.${SHORT_SHA}"
          echo "Build-Version: ${BUILD_VERSION}"
          cat > backend/infrastructure/_build_version.py <<EOF
          """Im CI erzeugte Build-Version. Nicht committet (siehe .gitignore)."""

          BUILD_VERSION = "${BUILD_VERSION}"
          EOF

      # Quelltextarchiv NUR im x64-Job -- der Quelltext ist architekturunabhaengig,
      # ein zweites identisches Archiv aus dem ARM-Job waere Dopplung und wuerde
      # beim Release-Upload mit demselben Dateinamen kollidieren.
      #
      # Platzierung: nach dem Versionsschritt und VOR dem Bau. Grund: das Archiv
      # entsteht auf dem RUNNER (nicht im Container), wo git nutzbar ist -- der
      # Schritt Zeile 60 nutzt dort bereits 'git rev-parse'. Ablage in dist-source/
      # im Repo-Wurzelverzeichnis, bewusst AUSSERHALB von src-tauri/target, damit
      # der spaetere chown-Schritt und Cargos target-Aufraeumen es nicht beruehren.
      # Weil der Schritt als Runner-User laeuft, gehoeren die Dateien ihm bereits --
      # kein chown noetig.
      #
      # 'git archive HEAD' liest den COMMIT, nicht das Arbeitsverzeichnis: der
      # flache Klon (checkout ohne fetch-depth) genuegt, und spaetere Build-
      # Artefakte im Baum koennen den Inhalt nicht verfaelschen.
      #
      # Die Produktfassung stammt aus derselben Quelle wie oben (pyproject.toml),
      # NICHT aus dem Tag-Namen und nicht aus github.ref -- damit das Archiv auch
      # bei workflow_dispatch korrekt benannt ist. Sie wird hier neu abgeleitet,
      # weil PRODUCT_VERSION oben shell-lokal ist und nicht exportiert wird.
      # Deshalb traegt dieser Schritt auch KEINE if-Bedingung: er laeuft bei jedem
      # Trigger, damit ein Dispatch-Lauf die Archiverzeugung mitprueft.
      - name: Quelltextarchiv und Pruefsumme erzeugen
        run: |
          set -euo pipefail
          PRODUCT_VERSION=$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')
          [ -n "$PRODUCT_VERSION" ] || { echo "FEHLER: Produktversion aus pyproject.toml nicht lesbar"; exit 1; }
          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          OUT_DIR="dist-source"
          mkdir -p "$OUT_DIR"
          ARCHIV="${OUT_DIR}/CernisPro_${PRODUCT_VERSION}_source.tar.gz"

          git archive --format=tar.gz \
            --prefix="CernisPro-${PRODUCT_VERSION}/" \
            -o "$ARCHIV" HEAD

          # Abbruch mit benannter Meldung, wenn das Archiv fehlt oder leer ist.
          # Kein stiller Durchlauf: ein gruener Lauf allein belegt nichts.
          [ -f "$ARCHIV" ] || { echo "FEHLER: Quelltextarchiv ${ARCHIV} wurde nicht erzeugt"; exit 1; }
          [ -s "$ARCHIV" ] || { echo "FEHLER: Quelltextarchiv ${ARCHIV} ist leer"; exit 1; }

          # Pruefsummendatei im Format von sha256sum, mit blossem Dateinamen ohne
          # Pfad -- so traegt 'sha256sum -c' im Verzeichnis der Datei.
          ( cd "$OUT_DIR" && sha256sum "$(basename "$ARCHIV")" > "$(basename "$ARCHIV").sha256" )

          # Nur echte Dateien zaehlen: tar listet auch Verzeichniseintraege (auf
          # / endend). Ohne den Filter meldete die Konsole eine zu hohe Zahl, die
          # nicht mehr mit 'git ls-files' vergleichbar waere.
          # '|| true' faengt den Exit-Status 1 von grep bei null Treffern ab --
          # unter 'set -e' braeche der Schritt sonst hier kommentarlos ab, statt
          # gleich darunter mit der benannten Meldung.
          ANZAHL=$(tar -tzf "$ARCHIV" | grep -vc '/$' || true)
          GROESSE=$(wc -c < "$ARCHIV")
          [ "$ANZAHL" -gt 0 ] || { echo "FEHLER: Quelltextarchiv ${ARCHIV} enthaelt keine Dateien"; exit 1; }

          echo "--- Quelltextarchiv ---"
          echo "Dateiname:     $(basename "$ARCHIV")"
          echo "Groesse:       ${GROESSE} Bytes"
          echo "Eintraege:     ${ANZAHL}"
          echo "Pruefsumme:    $(cat "${ARCHIV}.sha256")"
          echo "Commit (kurz): ${SHORT_SHA}"

      # Den unveraenderten build-linux.sh IM Container ausfuehren. Das Repo wird
      # nach /build gemountet, die erzeugten Bundles landen so wieder auf dem
      # Host (fuer den Artefakt-Upload sichtbar). '-v /build/.venv' legt ein
      # anonymes Volume ueber .venv -> der Container synchronisiert dort frisch
      # (uv sync), ohne eine evtl. vorhandene Host-.venv zu beruehren.
      - name: Linux-Build im Container (Frontend + Binaries + Tauri-Bundle)
        run: |
          docker run --rm \
            -v "$PWD":/build \
            -v /build/.venv \
            -w /build \
            cernis-build:debian13 \
            bash -c '
              set -e
              echo "--- uv sync (Deps + .venv, inkl. Dev-Gruppe fuer PyInstaller) ---"
              uv sync --locked --group dev
              echo "--- build-linux.sh (unveraendert) ---"
              bash build-linux.sh
            '

      # Kernbeweis: verhindert, dass je wieder ein Bundle mit RDMA-gelinkter
      # libpcap ausgeliefert wird. Das erzeugte deb wird entpackt, der enthaltene
      # cernis-sniffd kurz gestartet (er entpackt sich als PyInstaller-onefile
      # nach /tmp/_MEI...), dort libpcap.so.0.8 gesucht und per readelf -d
      # geprueft, dass KEIN libibverbs in den NEEDED-Eintraegen steht. Schlaegt
      # die Pruefung fehl, bricht der Workflow ab. Laeuft im selben Debian-Image
      # (readelf/dpkg-deb vorhanden), Repo erneut nach /build gemountet.
      - name: Verifikation -- gebundelte libpcap ohne libibverbs
        run: |
          docker run --rm \
            -v "$PWD":/build \
            -w /build \
            cernis-build:debian13 \
            bash -c '
              set -e
              TRIPLE="x86_64-unknown-linux-gnu"
              BUNDLE="/build/src-tauri/target/$TRIPLE/release/bundle"
              DEB=$(find "$BUNDLE/deb" -name "*.deb" -print -quit)
              [ -n "$DEB" ] || { echo "FEHLER: kein deb gefunden"; exit 1; }
              echo "deb: $DEB"

              WORK=$(mktemp -d)
              dpkg-deb -x "$DEB" "$WORK"
              SNIFFD=$(find "$WORK" -name "cernis-sniffd" -type f -print -quit)
              [ -n "$SNIFFD" ] || { echo "FEHLER: cernis-sniffd nicht im deb"; exit 1; }
              chmod +x "$SNIFFD"

              # onefile-sniffd starten; er entpackt sich nach TMPDIR/_MEI...
              MEIROOT=$(mktemp -d)
              TMPDIR="$MEIROOT" "$SNIFFD" >/tmp/sniffd.log 2>&1 &
              PID=$!
              LIB=""
              for _ in $(seq 1 60); do
                LIB=$(find "$MEIROOT" -name "libpcap.so.0.8" -print -quit 2>/dev/null || true)
                [ -n "$LIB" ] && break
                sleep 0.25
              done
              kill $PID 2>/dev/null || true
              [ -n "$LIB" ] || { echo "FEHLER: libpcap.so.0.8 nicht im _MEI entpackt"; cat /tmp/sniffd.log; exit 1; }
              echo "geprueft: $LIB"

              echo "--- readelf -d NEEDED ---"
              readelf -d "$LIB" | grep NEEDED || true
              if readelf -d "$LIB" | grep -qi ibverbs; then
                echo "FEHLER: libibverbs in NEEDED der gebundelten libpcap -- RDMA-gelinkt, SNI-Blocker!"
                exit 1
              fi
              echo "OK: KEIN libibverbs in NEEDED"
            '

      # Der Container laeuft als root, die im Container erzeugten Bundles
      # gehoeren daher root. Der Artefakt-Upload laeuft als Runner-User und
      # braucht Lesezugriff -- also die Besitzrechte der erzeugten Dateien im
      # Container auf die vom Host uebergebene UID/GID des Runner-Users
      # zuruecksetzen. Betroffen ist mindestens src-tauri/target/, dazu die
      # Python-Build-Artefakte und node_modules.
      - name: Besitzrechte der Bundle-Dateien auf Runner-User zuruecksetzen
        run: |
          docker run --rm \
            -v "$PWD":/build \
            -w /build \
            cernis-build:debian13 \
            bash -c "chown -R $(id -u):$(id -g) \
              src-tauri/target backend/dist backend/build node_modules 2>/dev/null || true"

      # Pruefsummen der Pakete. Platzierung zwingend NACH dem Bau und NACH dem
      # chown-Schritt darueber: der Bau laeuft im Container als root, die Bundles
      # gehoeren danach root. Erst der chown gibt sie an den Runner-User zurueck --
      # vorher koennte dieser Schritt die .sha256-Dateien nicht neben die Pakete
      # legen. Laeuft auf dem Runner, nicht im Container.
      #
      # KEINE if-Bedingung: die Pruefsummen entstehen bei jedem Trigger, damit ein
      # Dispatch-Lauf den Schritt mitprueft und nicht erst der Tag-Lauf.
      #
      # Format: sha256sum schreibt "Pruefsumme, zwei Leerzeichen, Dateiname". Durch
      # den Wechsel ins Verzeichnis der Datei steht dort der blosse Dateiname ohne
      # Pfad -- so traegt 'sha256sum -c datei.sha256' im Zielverzeichnis.
      - name: Pruefsummen der Pakete erzeugen
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"

          ANZAHL=0
          while IFS= read -r PAKET; do
            ( cd "$(dirname "$PAKET")" && sha256sum "$(basename "$PAKET")" > "$(basename "$PAKET").sha256" )
            echo "$(cat "${PAKET}.sha256")"
            ANZAHL=$((ANZAHL + 1))
          done < <(find "$BUNDLE" -type f \( -name '*.deb' -o -name '*.rpm' \) | sort)

          # Abbruch mit benannter Meldung, wenn keine einzige Paketdatei gefunden
          # wurde. Kein stiller Durchlauf, kein Rueckfall auf eine schwaechere
          # Pruefung -- ein leerer Fund ist ein Fehler, kein Normalfall.
          [ "$ANZAHL" -gt 0 ] || { echo "FEHLER: keine deb- oder rpm-Datei unter ${BUNDLE} gefunden"; exit 1; }
          echo "Pruefsummen erzeugt: ${ANZAHL}"

      # Ab hier Fallunterscheidung nach Trigger. Beide Faelle laufen ERST nach
      # Verifikation und chown -- diese beiden Schritte oben sind unveraendert
      # und gelten fuer beide Pfade gleichermassen.
      #
      # Fall a) v-Tag: NICHT als Actions-Artefakt hochladen (zaehlt gegen das
      # 500-MB-Gratislimit und verfaellt), sondern als GitHub-Release-Asset
      # veroeffentlichen. Release-Assets zaehlen nicht gegen das Limit und
      # verfallen nicht.
      #
      # Werkzeugwahl: softprops/action-gh-release statt handgeschriebener
      # gh-CLI-Aufrufe. Gruende: die Action legt ein fehlendes Release fuer den
      # Tag idempotent selbst an (kein "gh release view || gh release create"
      # noetig), haengt mehrere Dateien per Glob an und bietet mit
      # fail_on_unmatched_files genau die geforderte Abbruch-bei-leerem-Glob-
      # Semantik out of the box. Mit gh-CLI muesste all das von Hand in Shell
      # nachgebaut werden (Existenzpruefung, Glob-Expansion, Fehlerabbruch) --
      # mehr Code, mehr Wartung, mehr Fehlerquellen. Der GITHUB_TOKEN wird von
      # der Action automatisch aus dem Job-Kontext genutzt (contents: write
      # oben). draft bleibt false, damit die Assets sofort verfuegbar sind;
      # prerelease ist bewusst true, weil ein Tag-Build noch keinen Plattform-Test
      # belegt -- die Freigabe erfolgt von Hand.
      - name: Release erstellen und Bundles als Assets anhaengen (nur v-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CERNIS PRO ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }} -- Release-Notes werden separat gepflegt."
          draft: false
          # Gemeinsame Festlegung ALLER Build-Workflows: prerelease true, Freigabe von Hand.
          prerelease: true
          # fail_on_unmatched_files bricht ab, wenn ein Glob KEINE Datei findet.
          # Damit erfuellt: das Release bleibt nicht still leer, wenn z.B. die
          # rpm fehlt -- der Schritt schlaegt fehl.
          fail_on_unmatched_files: true
          # Jedes Muster MUSS im Tag-Lauf treffen, sonst faellt das Release
          # (fail_on_unmatched_files oben). Die .sha256-Muster treffen, weil der
          # Schritt "Pruefsummen der Pakete erzeugen" neben JEDER deb/rpm eine
          # gleichnamige .sha256 anlegt und sonst selbst abbricht -- gibt es ein
          # Paket, gibt es auch seine Pruefsumme. Die beiden Quelltext-Muster
          # treffen, weil der Schritt "Quelltextarchiv und Pruefsumme erzeugen"
          # ohne if-Bedingung in jedem Lauf beide Dateien erzeugt und bei fehlendem
          # oder leerem Archiv abbricht. Beide Namen sind exakt (kein Glob), die
          # Fassung stammt aus pyproject.toml -- derselben Quelle wie im Schritt.
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sha256
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm.sha256
            dist-source/*_source.tar.gz
            dist-source/*_source.tar.gz.sha256

      # Fall b) kein v-Tag (workflow_dispatch): BEWUSST
      # KEIN Artefakt-Upload. Ein ~850-MB-Bundle je Push fuellte das 2-GB-Gratis-
      # Storage-Kontingent auf. Bei Push-Laeufen ist der erfolgreiche Durchlauf
      # des Builds (inkl. libpcap-Verifikation oben) selbst der Beweis -- die
      # fertigen Bundles werden nicht gebraucht. Verteilbare Bundles entstehen
      # ausschliesslich an v-Tags und werden dort (Fall a oben) als GitHub-
      # Release-Asset veroeffentlicht: die zaehlen separat gegen das Kontingent
      # und verfallen nicht.

  # Spiegelbild des x64-Jobs fuer aarch64. Laeuft unabhaengig und parallel
  # (keine needs-Abhaengigkeit) auf einem nativen ARM-Runner. Abweichungen zum
  # x64-Job: ARM-Runner, ARM-Dockerfile/Image-Tag, arm64-Versions-Suffix, das
  # ARM-Triple via CERNIS_BUILD_TRIPLE und die aarch64-Bundle-Pfade.
  build-linux-arm:
    # Nativer ARM-Runner statt ubuntu-latest -- kein QEMU-Cross-Build noetig.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Image aus der ARM-Werkbank Dockerfile.build.debian13.arm64.
      - name: Build-Image bauen (Debian 13 arm64, Quelle der Wahrheit)
        run: docker build -f Dockerfile.build.debian13.arm64 -t cernis-build:debian13-arm64 .

      # Wie x64, aber Versions-Suffix arm64 statt x64.
      - name: Build-Version erzeugen (_build_version.py)
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          # Produktversion aus pyproject.toml ableiten (Quelle der Wahrheit).
          PRODUCT_VERSION=$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')
          [ -n "$PRODUCT_VERSION" ] || { echo "FEHLER: Produktversion aus pyproject.toml nicht lesbar"; exit 1; }
          BUILD_VERSION="${PRODUCT_VERSION}+linuxarm64.${SHORT_SHA}"
          echo "Build-Version: ${BUILD_VERSION}"
          cat > backend/infrastructure/_build_version.py <<EOF
          """Im CI erzeugte Build-Version. Nicht committet (siehe .gitignore)."""

          BUILD_VERSION = "${BUILD_VERSION}"
          EOF

      # Wie x64, aber ARM-Image und CERNIS_BUILD_TRIPLE steuert build-linux.sh
      # auf das aarch64-Triple.
      - name: Linux-Build im Container (Frontend + Binaries + Tauri-Bundle)
        run: |
          docker run --rm \
            -v "$PWD":/build \
            -v /build/.venv \
            -w /build \
            -e CERNIS_BUILD_TRIPLE=aarch64-unknown-linux-gnu \
            cernis-build:debian13-arm64 \
            bash -c '
              set -e
              echo "--- uv sync (Deps + .venv, inkl. Dev-Gruppe fuer PyInstaller) ---"
              uv sync --locked --group dev
              echo "--- build-linux.sh (unveraendert) ---"
              bash build-linux.sh
            '

      # Wie x64, aber ARM-Triple und ARM-Image.
      - name: Verifikation -- gebundelte libpcap ohne libibverbs
        run: |
          docker run --rm \
            -v "$PWD":/build \
            -w /build \
            cernis-build:debian13-arm64 \
            bash -c '
              set -e
              TRIPLE="aarch64-unknown-linux-gnu"
              BUNDLE="/build/src-tauri/target/$TRIPLE/release/bundle"
              DEB=$(find "$BUNDLE/deb" -name "*.deb" -print -quit)
              [ -n "$DEB" ] || { echo "FEHLER: kein deb gefunden"; exit 1; }
              echo "deb: $DEB"

              WORK=$(mktemp -d)
              dpkg-deb -x "$DEB" "$WORK"
              SNIFFD=$(find "$WORK" -name "cernis-sniffd" -type f -print -quit)
              [ -n "$SNIFFD" ] || { echo "FEHLER: cernis-sniffd nicht im deb"; exit 1; }
              chmod +x "$SNIFFD"

              # onefile-sniffd starten; er entpackt sich nach TMPDIR/_MEI...
              MEIROOT=$(mktemp -d)
              TMPDIR="$MEIROOT" "$SNIFFD" >/tmp/sniffd.log 2>&1 &
              PID=$!
              LIB=""
              for _ in $(seq 1 60); do
                LIB=$(find "$MEIROOT" -name "libpcap.so.0.8" -print -quit 2>/dev/null || true)
                [ -n "$LIB" ] && break
                sleep 0.25
              done
              kill $PID 2>/dev/null || true
              [ -n "$LIB" ] || { echo "FEHLER: libpcap.so.0.8 nicht im _MEI entpackt"; cat /tmp/sniffd.log; exit 1; }
              echo "geprueft: $LIB"

              echo "--- readelf -d NEEDED ---"
              readelf -d "$LIB" | grep NEEDED || true
              if readelf -d "$LIB" | grep -qi ibverbs; then
                echo "FEHLER: libibverbs in NEEDED der gebundelten libpcap -- RDMA-gelinkt, SNI-Blocker!"
                exit 1
              fi
              echo "OK: KEIN libibverbs in NEEDED"
            '

      # Wie x64, aber ARM-Image.
      - name: Besitzrechte der Bundle-Dateien auf Runner-User zuruecksetzen
        run: |
          docker run --rm \
            -v "$PWD":/build \
            -w /build \
            cernis-build:debian13-arm64 \
            bash -c "chown -R $(id -u):$(id -g) \
              src-tauri/target backend/dist backend/build node_modules 2>/dev/null || true"

      # Wie x64: NACH dem Bau und NACH dem chown, ohne if-Bedingung. Einziger
      # Unterschied ist das aarch64-Triple im Bundle-Pfad. Ein Quelltextarchiv
      # entsteht hier bewusst NICHT -- das erzeugt allein der x64-Job, weil der
      # Quelltext architekturunabhaengig ist.
      - name: Pruefsummen der Pakete erzeugen
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/aarch64-unknown-linux-gnu/release/bundle"

          ANZAHL=0
          while IFS= read -r PAKET; do
            ( cd "$(dirname "$PAKET")" && sha256sum "$(basename "$PAKET")" > "$(basename "$PAKET").sha256" )
            echo "$(cat "${PAKET}.sha256")"
            ANZAHL=$((ANZAHL + 1))
          done < <(find "$BUNDLE" -type f \( -name '*.deb' -o -name '*.rpm' \) | sort)

          # Abbruch mit benannter Meldung, wenn keine einzige Paketdatei gefunden
          # wurde. Kein stiller Durchlauf, kein Rueckfall auf eine schwaechere
          # Pruefung.
          [ "$ANZAHL" -gt 0 ] || { echo "FEHLER: keine deb- oder rpm-Datei unter ${BUNDLE} gefunden"; exit 1; }
          echo "Pruefsummen erzeugt: ${ANZAHL}"

      # Fall a) v-Tag: Release-Assets, aber aarch64-Bundle-Pfade.
      - name: Release erstellen und Bundles als Assets anhaengen (nur v-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CERNIS PRO ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }} -- Release-Notes werden separat gepflegt."
          draft: false
          # Gemeinsame Festlegung ALLER Build-Workflows: prerelease true, Freigabe von Hand.
          prerelease: true
          fail_on_unmatched_files: true
          # Wie x64: die .sha256-Muster treffen, weil der Pruefsummen-Schritt neben
          # jeder deb/rpm eine gleichnamige .sha256 anlegt und sonst abbricht.
          # KEIN Quelltextarchiv hier -- das liefert allein der x64-Job, ein
          # zweites gleichnamiges Asset wuerde beim Upload kollidieren.
          files: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb.sha256
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm.sha256

      # Fall b) kein v-Tag: BEWUSST KEIN Artefakt-Upload -- gleiche Begruendung
      # wie im x64-Job. Ein ~850-MB-Bundle je Push fuellte das 2-GB-Gratis-
      # Storage-Kontingent auf. Bei Push-Laeufen ist der erfolgreiche Durchlauf
      # des Builds (inkl. libpcap-Verifikation oben) selbst der Beweis -- die
      # fertigen Bundles werden nicht gebraucht. Verteilbare Bundles entstehen
      # ausschliesslich an v-Tags und werden dort (Fall a oben) als GitHub-
      # Release-Asset veroeffentlicht: die zaehlen separat gegen das Kontingent
      # und verfallen nicht.
