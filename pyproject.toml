# CERNIS PRO 2.0 — alleinige Projekt-Konfiguration (Backend-Rewrite)
# Ersetzt verstreute Konfig (kein setup.cfg etc.). Abhaengigkeiten werden ueber
# uv.lock reproduzierbar fixiert. backend/requirements.txt bleibt vorerst
# bestehen, weil build.sh/build.ps1 noch darauf bauen (Retirement = Build-Thema).

[project]
name = "cernis-pro"
version = "2.0.0"
description = "CERNIS PRO — lokaler Netzwerk- und System-Scanner (Backend-Rewrite v2)"
requires-python = ">=3.12"
# Gesamtwerk ist GPL-2.0-only: scapy (GPL-2.0-only) im Sniffer zwingt v2,
# GPLv3 ausgeschlossen. Siehe docs/LICENSE_AUDIT_2026-07.md.
license = "GPL-2.0-only"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
]

# Laufzeit-Abhaengigkeiten. Pins gespiegelt aus backend/requirements.txt
# (Altbestand laeuft weiter) plus die drei neuen Bausteine der v2-Architektur:
# pydantic-settings (Konfiguration), structlog (Logging), pydantic (Modelle,
# bisher nur transitiv ueber fastapi — jetzt explizit).
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "structlog>=24.1.0",
    "cryptography>=48.0.1",
    "zeroconf>=0.132.0",
    "reportlab>=4.0.0,<4.3",
    "fritzconnection>=1.13.0",
    "psutil>=5.9.0",
    "pysnmp>=6.1.0",
    "dnspython>=2.4.0",
    "apscheduler>=3.10.0",
    "websockets>=12.0",
    "scapy>=2.5.0",
    "keyring>=25.7.0",
]

# Entwickler-/CI-Werkzeuge (PEP 735 dependency-group; von `uv sync` per Default
# mitinstalliert). httpx wird von fastapi.testclient.TestClient benoetigt.
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "import-linter>=2.0",
    "pre-commit>=3.7.0",
    "pyinstaller>=6.20.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[tool.uv]
# Anwendung, kein verteilbares Wheel — uv soll nur Abhaengigkeiten verwalten,
# nicht das Projekt selbst bauen.
package = false

# ── Ruff (Lint + Format) ──────────────────────────────────────────────────
# Greift waehrend der Migration nur auf den NEUEN Code unter backend/. Der
# Altbestand (modules/, main.py, ...) ist ausgeschlossen und wird Stueck fuer
# Stueck einbezogen, sobald er migriert ist (Strangler Fig).
[tool.ruff]
line-length = 100
target-version = "py312"
# backend/ ist die Import-Wurzel -> Pakete darunter gelten als First-Party
# (korrekte isort-Gruppierung: stdlib / third-party / first-party).
src = ["backend"]
extend-exclude = [
    "backend/modules",
    "backend/cernis_cli.py",
    "backend/runtime_hook.py",
    "backend/data",
    "backend/build",
    "backend/dist",
    "frontend",
    "node_modules",
    "src-tauri",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

# ── mypy (strict) ─────────────────────────────────────────────────────────
# Nur der neue Architektur-Code wird strikt geprueft. Die files-Liste waechst
# mit dem Code: hier das Skelett (Schritt 2); backend/tests folgt mit den Tests.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "backend"
files = [
    "backend/domain",
    "backend/ports",
    "backend/application",
    "backend/infrastructure",
    "backend/api",
    "backend/app.py",
    "backend/tests",
]

# Altbestand (modules/) ist bewusst nicht typisiert und nicht Teil der strikten
# Pruefung -- analog zum ruff-Ausschluss. Characterization-Tests duerfen ihn
# importieren, ohne dass mypy in den Legacy-Code hineinlaeuft.
[[tool.mypy.overrides]]
module = ["modules", "modules.*"]
follow_imports = "skip"
ignore_missing_imports = true

# APScheduler (feste dep, M.6 job_scheduler-Adapter) liefert KEINE Typ-Stubs / kein
# py.typed-Marker -> mypy meldet sonst "import-untyped". Nur die fehlenden Stubs
# ignorieren (NICHT follow_imports=skip -- es ist Third-Party, kein eigener Legacy-
# Code wie modules/main). Der Adapter castet die Trigger-Argumente selbst (str/int).
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

# psutil (feste dep, T.3 traffic-Adapter) liefert KEINE Typ-Stubs / kein py.typed-
# Marker -> mypy meldet sonst "import-untyped". Nur die fehlenden Stubs ignorieren
# (wie apscheduler, NICHT follow_imports=skip -- Third-Party, kein Legacy-Code). Der
# Adapter castet die psutil-Rueckgaben selbst (sconn-Felder/Process.name -> str).
[[tool.mypy.overrides]]
module = ["psutil.*"]
ignore_missing_imports = true

# scapy (feste dep, C.3 capture-Adapter) liefert nur PARTIELLE Stubs: die dynamisch
# erzeugten Layer-Klassen (DNS/IP/TCP/Ether/... , scapy.contrib.{lldp,cdp}) und die
# AsyncSniffer-Callback-Attribute fehlen darin -> mypy meldet sonst flaechig
# "attr-defined". Darum follow_imports=skip (wie modules/main, NICHT nur
# ignore_missing_imports wie apscheduler): die Stubs sind unvollstaendig genug, dass
# das Hineinlaufen mehr Rauschen als Sicherheit bringt. Der Adapter kapselt scapy
# ohnehin komplett in ``_scapy`` und arbeitet sonst nur mit den eigenen
# Domaenenmodellen -- die scapy-Seite ist bewusst untypisiert (``pkt: Any``).
[[tool.mypy.overrides]]
module = ["scapy.*"]
follow_imports = "skip"
ignore_missing_imports = true

# reportlab (feste dep, Block-1 export-Adapter, ADR 0015) liefert KEINE Typ-Stubs / kein
# py.typed-Marker -> mypy meldet sonst "import-untyped". Nur die fehlenden Stubs ignorieren
# (wie apscheduler/psutil, NICHT follow_imports=skip -- Third-Party, kein Legacy-Code). Der
# Adapter (``infrastructure.export_pdf``) kapselt reportlab komplett und arbeitet sonst nur
# mit dem eigenen ``domain.export.PdfReportModel`` -- die reportlab-Seite bleibt lokal.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────
# backend/ ist die Import-Wurzel (wie der Altbestand: `import modules.x`).
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

# ── import-linter (maschinell erzwungene Architektur-Regeln) ──────────────
# Bildet die fuenf Importregeln aus CLAUDE.md/Zielarchitektur ab. app.py ist
# bewusst NICHT Teil der root_packages (Composition-Root-Ausnahme, Regel 5).
# Lauf: `PYTHONPATH=backend uv run lint-imports` (backend/ ist die Import-Wurzel).
[tool.importlinter]
root_packages = ["domain", "ports", "application", "infrastructure", "api"]
# Merke fuer kuenftige Contracts: Sobald ein Contract externe Pakete als
# forbidden_modules nennt (hier pydantic/fastapi/structlog im domain-Verbot,
# ADR 0002), MUSS include_external_packages = true gesetzt sein -- sonst bricht
# lint-imports ab ("must have include_external_packages=True ...").
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain bleibt rein (nur domain + stdlib)"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["ports", "application", "infrastructure", "api"]

[[tool.importlinter.contracts]]
name = "ports kennen hoechstens domain"
type = "forbidden"
source_modules = ["ports"]
forbidden_modules = ["application", "infrastructure", "api"]

[[tool.importlinter.contracts]]
name = "application kennt nicht infrastructure/api"
type = "forbidden"
source_modules = ["application"]
forbidden_modules = ["infrastructure", "api"]

# api soll domain/ports/infrastructure nicht DIREKT importieren -- der Weg geht
# ueber application/. Indirekte Importe sind hier legitim und gewollt: api ruft
# application, und application kennt domain/ports (genau die Schichtung). Darum
# allow_indirect_imports -- das Verbot direkter api->infrastructure-Importe
# bleibt scharf, und indirekt ueber application ist unmoeglich, weil application
# selbst infrastructure nicht importieren darf (eigener Contract oben).
[[tool.importlinter.contracts]]
name = "api ruft nur application (nicht domain/ports/infrastructure direkt)"
type = "forbidden"
source_modules = ["api"]
forbidden_modules = ["domain", "ports", "infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "infrastructure kennt nicht application/api"
type = "forbidden"
source_modules = ["infrastructure"]
forbidden_modules = ["application", "api"]

# domain bleibt framework-frei (ADR 0002): keine Bindung an pydantic/fastapi/
# structlog. Macht die "nur stdlib"-Regel fuer die realistischen Versuchungen
# maschinell pruefbar.
[[tool.importlinter.contracts]]
name = "domain bleibt framework-frei (kein pydantic/fastapi/structlog)"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["pydantic", "fastapi", "structlog"]

# Jede Domaene kennt nur sich selbst -- die domain-Subpakete sind wechselseitig
# unabhaengig. Dieses Prinzip traegt die ganze Migration (jede Fremddomaenen-Naht
# laeuft ueber die Verdrahtung in app.py, nie ueber einen domain-internen Quer-
# import: devices-Projektion S.7d, scheduler-Callback M.6, der Broadcaster nimmt
# Domaenenobjekte statt fremde Typen). Bisher hielten es die Domaenen FAKTISCH ein,
# ohne Gate. Mit ``domain/metrics`` (M.8) wird die Versuchung erstmals real -- ein
# Aggregat-Querschnitt, dessen "fauler" Edit ``from domain.monitoring import
# PingSample`` waere. Darum jetzt strukturell statt punktuell erzwungen: ein
# independence-Contract ueber ALLE Subpakete, nicht nur metrics (das Prinzip ist
# universell, das Gate soll es auch sein). ``devices``/``settings`` sind Einzel-
# module, ``scanning``/``monitoring``/``metrics`` Pakete -- ``independence`` behandelt
# beide gleich (kein Import zwischen je zwei der genannten Module/Pakete).
[[tool.importlinter.contracts]]
name = "domain-Subpakete sind wechselseitig unabhaengig"
type = "independence"
modules = [
    "domain.devices",
    "domain.scanning",
    "domain.monitoring",
    "domain.metrics",
    "domain.settings",
    "domain.alerting",
    "domain.security",
    "domain.capture",
    "domain.agent",
    "domain.interfaces",
    "domain.traffic",
    "domain.process",
    "domain.analysis",
    "domain.diagnostics",
    "domain.export",
    "domain.resolver",
    "domain.sni",
    "domain.fritz_detail",
    "domain.cve",
    "domain.dns_watch",
    "domain.dns_bypass",
    "domain.dns_trust",
    "domain.scheduler",
]

# Die neuen Ringe duerfen den Altcode (modules/) NIE importieren. Der Legacy-Bezug
# bleibt strikt auf app.py beschraenkt (Composition Root, nicht analysiert) -- z. B.
# die Uebergangs-Kruecke des Bootstrap-Inits (P2.1b). So kann der Altcode nicht in
# die sauberen Ringe lecken; jeder Versuch bricht CI.
#
# ZWEI eng eingezaeunte Ausnahmen (ADR 0007, in M.4 um monitoring erweitert): die
# scanning- UND monitoring-Infrastructure-Adapter DUERFEN modules/ importieren -- eine
# Reimplementierung der systemnahen Schicht (scanning: Ping/Portscan/mDNS/SSDP/IPv6/
# Fritz; monitoring: Ping-Burst + osascript-Notification) waere Wegwerf-Arbeit vor dem
# in Vision 5.2 vorgesehenen moeglichen Sprachwechsel. Die Ausnahme ist SUBTRAKTIV ueber
# ignore_imports umgesetzt, NICHT als zweiter (additiver) Contract: ein
# forbidden-Contract kann nur verbieten, nie erlauben -- die Lockerung MUSS daher am
# bestehenden Contract haengen. source_modules/forbidden_modules bleiben unveraendert;
# ignore_imports schneidet ausschliesslich Importe AUS den Paketen
# `infrastructure.scanning` und `infrastructure.monitoring` (beliebige Tiefe via `**`)
# in den Altcode heraus.
#
# ALERTING-AUSNAHME ENTFERNT (A.8): Der alerting-Versand (osascript-Desktop + SMTP) ist
# jetzt im v2-Kern neu gebaut (`infrastructure.alerting.desktop_notifier` /
# `email_sender`), der Notifier-Adapter delegiert an diese statt an
# `modules.alerting.notify_email_with_log`; der SmtpConfig-Adapter nutzt bereits
# `infrastructure.crypto` statt `modules.crypto`. Damit importiert KEIN Modul unter
# `infrastructure.alerting` mehr aus `modules` -- die Ausnahme
# `infrastructure.alerting.** -> modules` matchte nichts mehr (import-linter bricht bei
# einem toten ignore hart ab) und ist ERSATZLOS gestrichen. Das ist eine
# VERSCHAERFUNG, keine Lockerung: `infrastructure.alerting` ist ab jetzt CI-hart gegen
# `modules` geblockt wie jeder andere saubere Ring. Genau der von ADR 0007 vorgesehene
# Endzustand ("faellt ganz weg, sobald die systemnahe Schicht ersetzt ist"). Der
# umgekehrte Legacy-Bezug `modules.alerting -> infrastructure.alerting` (Teil B
# `fire_alert` ruft den migrierten Versand) ist NICHT analysiert: `modules` ist kein
# root_package, import-linter betrachtet nur Kanten AUS den Ringen heraus.
#
# SCOPED innerhalb monitoring (ADR 0007): nur Pinger/Notifier nutzen modules
# (_ping_burst/_notify_macos); die sqlite-Repos und der TargetSource-Adapter kommen
# BEWUSST ohne modules aus (eigenes Schema wie SqliteScanHistoryRepository;
# TargetSource zieht Settings ueber den migrierten ports/settings-Port). Der
# `**`-Scope deckt das Paket maschinell ab; der minimal gehaltene reale
# modules-Footprint ist eine bewusste Disziplin, im ADR festgehalten.
#
# WICHTIG zur Pattern-Form (in S.4a empirisch korrigiert): Die Zielseite ist
# `modules` OHNE Suffix -- der forbidden-Contract loest die Kanten gegen das
# verbotene PAKET `modules` auf (nicht gegen `modules.resolver` o.ae.), also matcht
# nur `... -> modules`. Eine Form `... -> modules.**` matcht im Contract-Kontext
# NICHTS (verifiziert: "No matches for ignored import"). Das `**` auf der QUELLseite
# deckt jeden kuenftigen scanning-Adapter (discovery/portscan/mdns/ssdp/ipv6/fritz,
# S.4b) automatisch mit ab. JEDER andere Ring (domain, ports, application, api) und
# JEDER andere infrastructure-Adapter -- inkl. `infrastructure.alerting` (A.8) --
# bleibt vom selben Contract weiter CI-hart gegen modules/ geblockt (Probe: Import
# ausserhalb scanning/monitoring -> BROKEN).
[[tool.importlinter.contracts]]
name = "neue Ringe importieren NICHT den Altcode (modules/)"
type = "forbidden"
source_modules = ["domain", "ports", "application", "infrastructure", "api"]
forbidden_modules = ["modules"]
ignore_imports = [
    "infrastructure.scanning.** -> modules",
    "infrastructure.monitoring.** -> modules",
]
